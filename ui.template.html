<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font: 11px/16px Inter, system-ui, sans-serif; color: var(--figma-color-text, #222); }
  #stage { position: fixed; left: 0; top: 0; z-index: -1; }
  #stage img { position: absolute; }
  #stage edinstvo-glass { position: absolute; left: 0; top: 0; --glass-shadow: none; }
  #panel { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; background: var(--figma-color-bg, #fff); }
  #preview { flex: none; height: 170px; display: grid; place-items: center; background: var(--figma-color-bg-secondary, #f5f5f5); }
  #preview canvas { max-width: 100%; max-height: 170px; }
  #list { flex: 1; overflow: auto; padding: 8px 12px; }
  label { display: grid; grid-template-columns: 84px minmax(0, 1fr) 34px; align-items: center; gap: 8px; height: 26px; text-transform: capitalize; }
  input { width: 100%; margin: 0; accent-color: var(--figma-color-bg-brand, #0d99ff); }
  output { text-align: right; color: var(--figma-color-text-secondary, #777); }
  button { flex: none; margin: 8px 12px 12px; height: 32px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; color: #fff; background: var(--figma-color-bg-brand, #0d99ff); }
  button:disabled { opacity: .4; }
</style>
<div id="stage"><img id="back" alt=""><edinstvo-glass id="glass" source="#back"></edinstvo-glass></div>
<div id="panel">
  <div id="preview"><canvas id="view"></canvas><span id="note">Select one shape.</span></div>
  <div id="list"></div>
  <button id="apply" disabled>Apply</button>
</div>
<script>Object.defineProperty(window, "devicePixelRatio", { value: 2 });</script>
<script>
/*GLASS*/
const { defaults, ranges, defineGlass } = glass;
const send = (message) => parent.postMessage({ pluginMessage: message }, "*");
const $ = (id) => document.getElementById(id);
const dpr = 2;
const keys = Object.keys(ranges);
const inputs = {};
let current = null;
let frames = 0;

defineGlass();
const surface = $("glass").shadowRoot.querySelector("canvas");

for (const key of keys) {
  const [min, max] = ranges[key];
  const label = document.createElement("label");
  label.innerHTML = `<span>${key.replace(/[A-Z]/g, (c) => ` ${c.toLowerCase()}`)}</span><input type="range" min="${min}" max="${max}" step="${max - min > 2 ? 1 : 0.01}"><output></output>`;
  const [, input, output] = label.children;
  input.oninput = () => {
    output.textContent = +(+input.value).toFixed(2);
    update();
  };
  inputs[key] = input;
  $("list").append(label);
}

const settings = () => Object.fromEntries(keys.map((key) => [key, +inputs[key].value]));

function update() {
  $("glass").material = settings();
  frames = 40;
}

function crop() {
  const { width, height } = current.shape;
  const out = document.createElement("canvas");
  out.width = Math.round(width * dpr);
  out.height = Math.round(height * dpr);
  out.getContext("2d").drawImage(surface, parseFloat(surface.style.left) * dpr, parseFloat(surface.style.top) * dpr);
  return out;
}

function tick() {
  requestAnimationFrame(tick);
  if (!current || frames-- <= 0) return;
  const { x, y, width, height } = current.shape;
  const margin = Math.min(width, height) * 0.25;
  const view = $("view");
  view.width = (width + margin * 2) * dpr;
  view.height = (height + margin * 2) * dpr;
  const context = view.getContext("2d");
  const back = $("back");
  const ratio = back.naturalWidth / current.frame.width;
  context.drawImage(back, (x - margin) * ratio, (y - margin) * ratio, view.width / dpr * ratio, view.height / dpr * ratio, 0, 0, view.width, view.height);
  context.drawImage(surface, (margin + parseFloat(surface.style.left)) * dpr, (margin + parseFloat(surface.style.top)) * dpr);
}
tick();

onmessage = async ({ data }) => {
  const message = data.pluginMessage;
  if (message?.type === "empty") {
    current = null;
    $("note").textContent = message.text;
    $("note").hidden = false;
    $("view").hidden = true;
    $("apply").disabled = true;
  }
  if (message?.type !== "load") return;
  const { frame, shape } = message;
  const back = $("back");
  URL.revokeObjectURL(back.src);
  back.src = URL.createObjectURL(new Blob([message.bytes], { type: "image/png" }));
  await back.decode();
  Object.assign(back.style, { left: `${-shape.x}px`, top: `${-shape.y}px`, width: `${frame.width}px`, height: `${frame.height}px` });
  Object.assign($("glass").style, { width: `${shape.width}px`, height: `${shape.height}px`, borderRadius: `${shape.radius}px` });
  for (const key of keys) {
    inputs[key].value = message.settings[key] ?? defaults[key];
    inputs[key].dispatchEvent(new Event("input"));
  }
  current = message;
  $("note").hidden = true;
  $("view").hidden = false;
  $("apply").disabled = false;
  $("glass").invalidate?.();
  frames = 40;
};

$("apply").onclick = () => crop().toBlob(async (blob) => {
  send({ type: "apply", id: current.id, bytes: new Uint8Array(await blob.arrayBuffer()), settings: settings() });
}, "image/png");

send({ type: "ready" });
</script>
